<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>신곡 길잡이</title>
<script>document.documentElement.classList.add("js")</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=EB+Garamond:ital,wght@0,500;1,400&display=swap">
<style>
/* Layout: three Gothic pointed doorways on one threshold, drawn in thin ink like a manuscript.
   Hell's gate carries its inscription (Inf. III), Purgatory's sits on the three steps of Purg. IX
   (white marble, dark cracked stone, red porphyry), Paradise's opens under a rose window (Par. XXX). */
:root{
  --paper:#FFFFFF; --ink:#1F2226; --soft:#6C6A63;
  --d-inf:#1F2226; --d-purg:#A9A59C; --d-para:#F3F1EC; --step-dark:#5A5853; --porph:#9B4A40; --rose:#1F2226; --glow:rgba(222,206,160,.55); --wash:rgba(243,241,236,.55);
  --f-display:"Gowun Batang","AppleMyungjo","Noto Serif KR",serif;
  --f-lat:"EB Garamond",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16181B; --ink:#ECEAE4; --soft:#A29F97;
  --d-inf:#050607; --d-purg:#6E6F6C; --d-para:#ECEAE4; --step-dark:#3A3C40; --porph:#B9665A; --rose:#3A3C40; --glow:rgba(236,226,190,.18); --wash:rgba(22,24,27,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181B; --ink:#ECEAE4; --soft:#A29F97;
  --d-inf:#050607; --d-purg:#6E6F6C; --d-para:#ECEAE4; --step-dark:#3A3C40; --porph:#B9665A; --rose:#3A3C40; --glow:rgba(236,226,190,.18); --wash:rgba(22,24,27,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);margin:0;-webkit-text-size-adjust:100%}
.gate{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding-inline:20px;padding-block:48px}
.title{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0}
.title .lat{font-family:var(--f-lat);font-weight:500;font-size:13px;letter-spacing:.32em;padding-left:.32em;color:var(--soft)}
.title .ko{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.3em;padding-left:.3em}
.egg{position:relative;color:var(--ink);text-decoration:none;cursor:default;-webkit-tap-highlight-color:transparent}
.egg:focus-visible{outline:none}
.egg .cross{position:absolute;left:100%;top:50%;width:12px;height:20px;margin-left:3px;transform:translateY(-55%) scale(.6);opacity:0;transition:opacity 1s ease .1s,transform 1.2s ease .1s}
.egg .cross path{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linecap:round}
.egg.lit .cross{opacity:.5;transform:translateY(-55%) scale(1)}
/* a soft light spreading from the title over the page */
.veil{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity 1.3s ease;
  background:radial-gradient(circle at 50% var(--vy,22%),var(--glow) 0%,transparent 55%),linear-gradient(var(--wash),var(--wash))}
body.lit .veil{opacity:1}
body.lit .row{opacity:.18;filter:blur(1.5px);transition:opacity 1.1s ease,filter 1.1s ease}
body.lit .title .lat{letter-spacing:.42em;transition:letter-spacing 1.4s ease}
.title{position:relative;z-index:4}
.say{position:relative;z-index:4}
@media (prefers-reduced-motion:reduce){.egg .cross,.veil,body.lit .row,body.lit .title .lat{transition:none}}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,5vw,44px);width:min(100%,560px)}
.doors{border-bottom:1px solid var(--ink)}
.door{display:block;text-decoration:none;color:var(--ink)}
.door svg{display:block;width:100%;height:auto;overflow:visible}
.door .frame{fill:none;stroke:var(--ink);stroke-width:1}
.door .opening{fill:var(--dc);stroke:var(--ink);stroke-width:1;transition:fill-opacity .3s}
.door .line{fill:none;stroke:var(--rose);stroke-width:.8}
.door .lineL{fill:none;stroke:var(--paper);stroke-width:.8;opacity:.55}
.door .insc{fill:var(--ink);font-family:var(--f-lat);font-weight:500;font-size:8.5px;letter-spacing:.14em;text-anchor:middle}
.door.on .frame{stroke-width:2}
.door:hover .frame,.door:focus-visible .frame{stroke-width:2}
.door:focus-visible{outline:none}
.inf{--dc:var(--d-inf)}.purg{--dc:var(--d-purg)}.para{--dc:var(--d-para)}
.st-white{fill:var(--paper);stroke:var(--ink);stroke-width:1}
.st-dark{fill:var(--step-dark);stroke:var(--ink);stroke-width:1}
.st-red{fill:var(--porph);stroke:var(--ink);stroke-width:1}
.labels{margin-top:-20px}
.labels a{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;color:var(--ink)}
.labels b{font-family:var(--f-display);font-weight:700;font-size:clamp(17px,4.4vw,21px)}
.labels i{font-family:var(--f-lat);font-size:15px;color:var(--soft)}
.say{min-height:5em;margin:-14px 0 0;text-align:center;font-family:var(--f-display);font-size:15px;line-height:1.6;color:var(--ink);opacity:0;transition:opacity .4s}
.say.on{opacity:1}
.going .door:not(.on),.going .labels a{opacity:.25;transition:opacity .6s}
.going .door.on .opening{fill-opacity:.85}.say .it{display:block;font-family:var(--f-lat);font-style:italic;font-size:18px}.say small{display:block;font-size:13px;color:var(--soft)}
.hint{margin:-20px 0 0;text-align:center;font-size:12.5px;color:var(--soft);font-family:var(--f-display)}
html:not(.js) .hint{display:none}
.labels a:hover b,.labels a:focus-visible b{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
@media (prefers-reduced-motion:reduce){.door .opening,.say{transition:none}}
</style>
</head>
<body>
<main class="gate">
<h1 class="title"><span class="lat">LA DIVINA COMMEDIA</span><a class="ko egg" href="Dante4.html" aria-label="신곡" data-it="la larga ploia / de lo Spirito Santo, ch'è diffusa / in su le vecchie e 'n su le nuove cuoia" data-ko="" data-src="">신곡<svg class="cross" viewBox="0 0 10 16" aria-hidden="true"><path d="M5 0.5V15.5M1 4.5H9"/></svg></a></h1>

<nav class="row doors" aria-label="세 편">
<a class="door inf" data-it="Lasciate ogne speranza, voi ch'intrate." data-ko="여기 들어오는 너희는 모든 희망을 버려라" data-src="지옥 문 위에 새겨진 글 · 지옥편 3곡" href="Dante1.html" aria-label="지옥편">
<svg viewBox="0 0 120 300" aria-hidden="true">
<text class="insc" x="60" y="8">LASCIATE OGNE</text>
<text class="insc" x="60" y="19">SPERANZA</text>
<path class="frame" d="M6 300V122A108 108 0 0 1 60 28.5A108 108 0 0 1 114 122V300"/>
<path class="opening" d="M14 300V122A92 92 0 0 1 60 42.3A92 92 0 0 1 106 122V300Z"/>
</svg></a>

<a class="door purg" data-it="Per correr miglior acque alza le vele" data-ko="더 좋은 물을 달리려 돛을 올린다" data-src="연옥편 첫 줄 · 연옥편 1곡" href="Dante2.html" aria-label="연옥편">
<svg viewBox="0 0 120 300" aria-hidden="true">
<path class="frame" d="M6 270V122A108 108 0 0 1 60 28.5A108 108 0 0 1 114 122V270"/>
<path class="opening" d="M14 270V122A92 92 0 0 1 60 42.3A92 92 0 0 1 106 122V270Z"/>
<rect class="st-red" x="8" y="270" width="104" height="10"/>
<rect class="st-dark" x="3" y="280" width="114" height="10"/>
<path class="lineL" d="M40 281l4 4-3 4M78 281l-3 5 4 3"/>
<rect class="st-white" x="-2" y="290" width="124" height="10"/>
</svg></a>

<a class="door para" data-it="La gloria di colui che tutto move" data-ko="모든 것을 움직이는 분의 영광이" data-src="천국편 첫 줄 · 천국편 1곡" href="Dante3.html" aria-label="천국편">
<svg viewBox="0 0 120 300" aria-hidden="true">
<path class="frame" d="M6 300V122A108 108 0 0 1 60 28.5A108 108 0 0 1 114 122V300"/>
<path class="opening" d="M14 300V122A92 92 0 0 1 60 42.3A92 92 0 0 1 106 122V300Z"/>
<g transform="translate(60 98)">
<circle class="line" r="21"/><circle class="line" r="15"/><circle class="line" r="5"/>
<path class="line" d="M0-15V-5M0 5V15M-15 0H-5M5 0H15M-10.6-10.6L-3.5-3.5M3.5 3.5L10.6 10.6M10.6-10.6L3.5-3.5M-3.5 3.5L-10.6 10.6"/>
<circle class="line" cx="0" cy="-18" r="3"/><circle class="line" cx="0" cy="18" r="3"/><circle class="line" cx="18" cy="0" r="3"/><circle class="line" cx="-18" cy="0" r="3"/>
<circle class="line" cx="12.7" cy="12.7" r="3"/><circle class="line" cx="-12.7" cy="12.7" r="3"/><circle class="line" cx="12.7" cy="-12.7" r="3"/><circle class="line" cx="-12.7" cy="-12.7" r="3"/>
</g>
</svg></a>
</nav>

<div class="row labels">
<a href="Dante1.html"><b>지옥</b><i lang="it">Inferno</i></a>
<a href="Dante2.html"><b>연옥</b><i lang="it">Purgatorio</i></a>
<a href="Dante3.html"><b>천국</b><i lang="it">Paradiso</i></a>
</div>
<div class="veil" aria-hidden="true"></div>
<p class="say" id="say" aria-live="polite"></p>
</main>
<script>
(function(){
  document.documentElement.classList.add("js");
  var doors=[].slice.call(document.querySelectorAll(".door")),say=document.getElementById("say");
  function show(d){doors.forEach(function(x){x.classList.toggle("on",x===d);});
    say.innerHTML="<span class=\"it\" lang=\"it\">"+d.getAttribute("data-it")+"</span>"+d.getAttribute("data-ko")+"<small>"+d.getAttribute("data-src")+"</small>";say.classList.add("on");}
  var timer=null;
  doors.forEach(function(d){
    if(window.matchMedia&&matchMedia("(hover:hover)").matches){d.addEventListener("mouseenter",function(){show(d);});}
    d.addEventListener("click",function(ev){
      ev.preventDefault(); show(d); document.body.classList.add("going");
      var href=d.getAttribute("href"); clearTimeout(timer);
      timer=setTimeout(function(){location.href=href;},1300);
    });
  });
  var egg=document.querySelector('.egg'), eggT=null;
  egg.addEventListener('click',function(ev){ev.preventDefault(); if(egg.classList.contains('lit')) return;
    doors.forEach(function(x){x.classList.remove('on');}); document.body.classList.remove('going');
    var r=egg.getBoundingClientRect(); document.querySelector('.veil').style.setProperty('--vy',((r.top+r.height/2)/innerHeight*100)+'%');
    say.innerHTML='<span class="it" lang="it">'+egg.getAttribute('data-it')+'</span>'+egg.getAttribute('data-ko')+'<small>'+egg.getAttribute('data-src')+'</small>';
    say.classList.add('on'); egg.classList.add('lit'); document.body.classList.add('lit'); clearTimeout(eggT);
    eggT=setTimeout(function(){location.href=egg.getAttribute('href');},1900);});
  window.addEventListener("pageshow",function(){egg.classList.remove('lit');document.body.classList.remove('lit');document.body.classList.remove("going");doors.forEach(function(x){x.classList.remove("on");});say.classList.remove("on");});
})();
</script>
</body>
</html>
