<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계절의 서가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--paper2:#F1EFEA;--ink:#1F2226;--soft:#6C6A63;--rule:#E0DDD6;--off:#D8D5CE;
--en:#A03A34;--ko:#1F4D45;--de:#6B5B95;--fr:#C1902F;--ja:#7D9A4F;--es:#C4603D;--ru:#2F5D8C;--zh:#8E4A6B;--sv:#3E8A8C;--etc:#8A7A69;
--ebook:#1F4D45;--paperbook:#C1902F;--buy:#6B5B95;--rent:#A03A34;--special:#C4603D;--normal:#2F5D8C;--ott:#5C7A6A;
--netflix:#E50914;--tving:#FF6B00;--wavve:#1F8FFF;--disneyplus:#0F3EBE;--coupangplay:#FF3D75;--appletv:#1D1D1F;
--r1:#F3E4E1;--r2:#E3BFB8;--r3:#CE8F84;--r4:#B85B4C;--r5:#A03A34;}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.7;letter-spacing:0}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px}
h1,h2{font-family:"Gowun Batang",Georgia,serif}
h1{font-size:clamp(30px,7.5vw,52px);font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:0 0 14px}
header{padding:52px 0 0}
.kicker{font-family:"Gowun Batang",serif;font-size:15px;color:var(--soft);margin:0 0 18px}
section{padding-top:52px}
.year-head{display:flex;align-items:baseline;gap:12px;margin:0 0 4px;padding-top:36px;border-top:1px solid var(--rule)}
.year-head h2{font-size:26px;font-weight:700;margin:0;line-height:1.2}
.year-head span{font-size:12.5px;color:var(--soft)}
.ynav{margin-left:auto;display:flex;gap:8px;flex:none;align-items:center}
.ynav button{font-family:"Gowun Batang",serif;font-size:17px;font-weight:700;line-height:1;height:40px;padding:0 12px;display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:transparent;color:var(--soft);cursor:pointer}
.ynav button:hover{border-color:var(--ink);color:var(--ink)}
.ynav button:focus-visible{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}
.ynav button[hidden]{visibility:hidden;display:flex}
.yblock[hidden]{display:none}
.sub{padding-top:52px}
.sub h3{font-family:"Gowun Batang",Georgia,serif;font-size:clamp(20px,4.6vw,27px);font-weight:700;line-height:1.4;margin:0 0 6px;letter-spacing:-.02em}
.sub p.lede{margin:0;color:var(--soft);font-size:15px;max-width:40em}
.sub .body{margin-top:22px}
/* 통계 — facts 테두리 */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--rule);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0}
.fact{background:var(--paper);padding:16px 4px 18px}
.fact .num{display:block;font-family:"Gowun Batang",serif;font-size:34px;font-weight:700;line-height:1.05}
.fact .lbl{display:block;font-size:13px;color:var(--soft);margin-top:5px;line-height:1.45}
.stat-note{font-size:15px;color:#4A4842;line-height:1.75;margin:18px 0 0}
.stat-note b{font-weight:500}
/* 드라마 — 컴팩트 한 줄 */
.d-axis{display:grid;grid-template-columns:1fr 132px;gap:10px;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:3px}
.d-axis-l{font-size:12px;color:var(--soft)}
.d-ticks{display:grid;grid-template-columns:repeat(12,1fr);font-size:9.5px;color:var(--off);text-align:center;line-height:1.3}
.d-row{display:grid;grid-template-columns:1fr 132px;gap:10px;align-items:center;min-height:32px;padding:0 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.d-row:hover{background:rgba(31,34,38,.04)}
.d-row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.d-left{display:flex;align-items:center;gap:8px;min-width:0}
.d-dot{width:15px;height:15px;border-radius:3px;flex:none;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;line-height:1}
.d-title{font-family:"Gowun Batang",serif;font-size:14px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-per{font-size:11.5px;color:var(--soft);flex:none}
.d-track{display:grid;grid-template-columns:repeat(12,1fr);height:7px;background:repeating-linear-gradient(to right,var(--rule) 0 1px,transparent 1px calc(100%/12))}
.d-bar{height:7px;display:block;background:var(--c)}
/* 웹툰 — 괘선 표 */
table.web{width:100%;border-collapse:collapse;font-size:15px}
table.web td{text-align:left;padding:11px 6px;border-bottom:1px solid var(--rule);vertical-align:baseline}
table.web td.k{color:var(--soft);font-size:13px;white-space:nowrap;width:64px}
table.web td.t{font-family:"Gowun Batang",serif;font-weight:700}
table.web td.t a{color:var(--ink);text-decoration:none}
table.web td.t a:hover{text-decoration:underline;text-underline-offset:3px}
table.web td.s{color:var(--soft);font-size:13px;text-align:right;white-space:nowrap;width:56px}
.sec-head{margin-bottom:22px}.sec-head p{margin:0;color:var(--soft);font-size:15px}
.sec-word{font-family:"Gowun Batang",serif;font-size:15px;font-weight:700;color:var(--ink)}
.shelf-row{margin-bottom:16px}
.shelf-meta{display:flex;align-items:baseline;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.shelf-year{font-family:"Gowun Batang",serif;font-size:19px;font-weight:700}
.shelf-count{font-size:12.5px;color:var(--soft)}
.spines{display:grid;gap:2px;align-items:end;border-bottom:3px solid var(--ink);min-height:92px}
.spine{border:0;padding:0;margin:0;width:100%;border-radius:1px 1px 0 0;cursor:pointer;transition:filter .12s,transform .12s;transform-origin:bottom center}
.spine:hover{filter:brightness(1.22)}
.spine:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.spine[aria-pressed="true"]{transform:translateY(-7px);filter:brightness(1.3)}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 20px}
.mguide{font-size:13px;color:var(--soft);margin:-12px 0 10px}
.shelf-key{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 14px}
.shelf-key .lg{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--soft)}
.sk{width:11px;height:22px;flex:none;background:var(--ink)}
.sk.mv{border-radius:4px 4px 0 0;position:relative}
.sk.mv::after{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:0;height:0;border-style:solid;border-width:3px 0 3px 5px;border-color:transparent transparent transparent var(--paper)}
.mode{font-family:inherit;font-size:13px;padding:6px 13px;border:1px solid var(--rule);background:transparent;color:var(--soft);border-radius:999px;cursor:pointer}
.mode[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.readout{border:1px solid var(--rule);border-top:0;background:var(--paper2);padding:0 16px;overflow:hidden;max-height:0;opacity:0;transition:max-height .28s ease,opacity .2s ease,padding .28s ease}
.readout.open{max-height:460px;opacity:1;padding:14px 16px 16px}
.r-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-7px -8px 0 0}
.ronav{display:flex;flex:none}
.rnav{font-family:inherit;font-size:16px;line-height:1;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#8E897F;cursor:pointer;padding:0}
.rnav:hover{color:var(--ink)}
.rnav:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;color:var(--ink)}
.readout .r-date{font-size:12.5px;color:var(--soft)}
.readout .r-title{font-family:"Gowun Batang",serif;font-size:20px;font-weight:700;line-height:1.35;margin:2px 0 3px}
.readout .r-author{font-size:14px;color:var(--soft)}
.r-tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;padding:2px 9px;border:1px solid var(--rule);border-radius:999px;color:var(--soft)}
button.tag{font-family:inherit;background:transparent;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
button.tag:hover{background:#fff;color:var(--ink);border-color:var(--ink)}
.hint{font-size:13px;color:var(--soft);margin:10px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:5px 6px;margin:0 0 14px}
button.lg{font-family:inherit;font-size:13px;border:1px solid var(--rule);background:transparent;padding:4px 10px 4px 7px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--soft);transition:background .15s,border-color .15s,opacity .15s}
button.lg:hover{background:var(--paper2)}
button.lg:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
button.lg[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:500}
.legend.filtered button.lg[aria-pressed="false"]{opacity:.42}
.fhint{font-size:13px;color:var(--soft);margin:0 0 12px;min-height:1.2em}
.sw{width:11px;height:11px;border-radius:2px;flex:none}
.tile{position:relative;border-radius:5px 5px 0 0}
.tile::after{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:0;height:0;border-style:solid;border-width:3.5px 0 3.5px 6px;border-color:transparent transparent transparent var(--mk,#fff)}
.blank{color:var(--off);font-style:italic}
/* 그 해의 숫자들 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:15px 0 13px;margin-top:2px}
.stat{text-align:center}
.stat b{display:block;font-family:"Gowun Batang",serif;font-size:clamp(21px,5.6vw,30px);font-weight:700;line-height:1.15;color:var(--ink)}
.stat b i{font-style:normal;font-size:.52em;font-weight:400;color:var(--soft);margin-left:1px}
.stat span{display:block;font-size:11px;color:var(--soft);margin-top:2px;letter-spacing:-.02em}
.stat-note{font-size:12.5px;color:var(--soft);margin:2px 0 0}
.stat-note b{font-family:"Gowun Batang",serif;font-weight:700;color:var(--ink)}
/* 만난 날들 (월별 막대) */
.days{margin-top:14px}
.days-lede{font-size:13px;color:var(--soft);margin:0 0 12px}
.days-lede b{font-family:"Gowun Batang",serif;font-weight:700;color:var(--ink)}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:0 3px;align-items:end;height:96px}
.mcol{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:96px}
.mb{width:6px;flex:none}
.mb.bk{background:#4A4740}
.mb.mv{box-shadow:inset 0 0 0 1.5px #4A4740}
.mb.dr{background:#BFBBB2}
.maxis{display:grid;grid-template-columns:repeat(12,1fr);gap:0 3px;border-top:1px solid var(--rule);padding-top:5px;margin-top:4px}
.mlab{text-align:center;font-size:11px;color:var(--soft);line-height:1.4}
.mlab b{display:block;font-family:"Gowun Batang",serif;font-size:12px;font-weight:700;color:var(--ink);min-height:1.2em}
.days-key{margin:12px 0 0;display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}
.days-key .lg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft)}
.days-key .kb{width:8px;height:14px;flex:none}
/* 겹쳐진 이름들 */
.epigraph{font-family:"Gowun Batang",serif;font-size:14.5px;line-height:1.9;color:var(--soft);margin:0 0 20px;padding:2px 0 2px 14px;border-left:2px solid var(--rule)}
.thread{display:grid;grid-template-columns:minmax(88px,142px) 1fr auto;gap:5px 14px;padding:12px 0;border-bottom:1px dashed var(--rule)}
.thread:last-child{border-bottom:0}
.th-name{grid-column:1;grid-row:1;font-family:"Gowun Batang",serif;font-weight:700;font-size:15px;line-height:1.3;text-align:right;color:var(--ink);align-self:center}
.th-line{grid-column:2;grid-row:1;position:relative;display:flex;align-items:center;gap:5px;min-height:20px}
.th-line::before{content:"";position:absolute;left:2px;right:2px;top:50%;height:1px;background:var(--rule)}
.th-count{grid-column:3;grid-row:1;font-family:"Gowun Batang",serif;font-size:21px;font-weight:700;color:var(--ink);line-height:1;align-self:center}
.th-count em{font-style:normal;font-family:"IBM Plex Sans KR",sans-serif;font-size:11px;font-weight:400;color:var(--soft);margin-left:2px}
.th-desc{grid-column:2/4;grid-row:2;font-size:11.5px;line-height:1.6;color:var(--soft)}
.th-desc b{font-weight:500;color:#4A4740}
.bead{position:relative;flex:none;width:var(--bs,13px);height:var(--bs,13px);border-radius:2px;box-shadow:0 0 0 2px var(--paper)}
.bead.mv{border-radius:50%}
.th-key{margin:16px 0 0;display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}
.th-key .lg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft)}
/* 드라마 타임라인 */
.tl-seasons{display:grid;grid-template-columns:repeat(12,1fr);font-family:"Gowun Batang",serif;font-size:10.5px;color:var(--soft);text-align:center;line-height:16px}
.tl-months{display:grid;grid-template-columns:repeat(12,1fr);font-size:9.5px;color:var(--soft);text-align:center;line-height:15px;border-bottom:1px solid var(--rule)}
.tl-rows{position:relative;border-bottom:1px solid var(--rule);
 background:repeating-linear-gradient(to right,rgba(31,34,38,.05) 0 1px,transparent 1px calc(100%/12)),
 linear-gradient(to right,rgba(47,93,140,.05) 0 16.66%,rgba(125,154,79,.055) 16.66% 41.66%,rgba(193,144,47,.065) 41.66% 66.66%,rgba(160,58,52,.05) 66.66% 91.66%,rgba(47,93,140,.05) 91.66% 100%)}
.tl-row{position:relative;display:grid;grid-template-columns:repeat(12,1fr);align-items:center;height:23px;text-decoration:none;color:inherit;transition:opacity .18s}
a.tl-row:hover{background:rgba(31,34,38,.045)}
a.tl-row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.tl-bar{grid-row:1;height:14px;margin:0 1px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.tl-label{grid-row:1;font-family:"Gowun Batang",serif;font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.tl-label.rt{text-align:left;padding-left:6px}
.tl-label.lf{text-align:right;padding-right:6px}
.pb{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:3px;font-family:"IBM Plex Sans KR",sans-serif;font-size:9.5px;font-weight:700;flex:none}
/* 카카오페이지 진열 */
.kk-head{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soft);margin:0 0 10px}
.applogo{width:17px;height:17px;border-radius:4px;flex:none;display:block}
.kk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kk{position:relative;display:flex;gap:11px;align-items:center;padding:12px 26px 12px 0;background:var(--paper2);border-radius:8px;text-decoration:none;color:var(--ink);overflow:hidden;transition:transform .15s,background .15s,box-shadow .15s}
.kk::before{content:"";width:6px;align-self:stretch;background:var(--kind);border-radius:8px 0 0 8px;flex:none}
.kk::after{content:"\2192";position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--off);transition:transform .15s,color .15s}
.kk:hover{transform:translateY(-2px);background:#fff;box-shadow:0 2px 0 var(--rule)}
.kk:hover::after{color:var(--kind);transform:translateY(-50%) translateX(3px)}
.kk-t{font-family:"Gowun Batang",serif;font-size:14px;font-weight:700;line-height:1.35}
.kk-k{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-size:10.5px;font-weight:400;color:var(--kind);margin-top:2px;letter-spacing:-.02em}
@media (max-width:520px){.spines{min-height:76px}.kk-grid{grid-template-columns:1fr}
.d-axis,.d-row{grid-template-columns:1fr 96px;gap:8px}.d-title{font-size:13.5px}
.sub{padding-top:40px}.fact .num{font-size:28px}
header{padding:28px 0 0}.kicker{margin:0 0 10px}h1{margin:0 0 6px}
section:first-of-type{padding-top:20px}
.sec-head{margin-bottom:10px}.modes{margin:2px 0 10px}.legend{margin:0 0 8px}
.fhint{min-height:0;margin:0 0 6px}.mguide{margin:-6px 0 8px}
.thread{grid-template-columns:1fr auto;row-gap:7px;column-gap:10px}
.th-name{text-align:left;grid-column:1;grid-row:1}
.th-count{grid-column:2;grid-row:1}
.th-line{grid-column:1/-1;grid-row:2}
.th-desc{grid-column:1/-1;grid-row:3}
.tl-label{font-size:10.5px}.tl-row{height:21px}
.stats{gap:4px}.mb{width:5px}.mlab{font-size:10.5px}}
</style></head><body><div class="wrap">

<script>
const DRAMAS=[
["언더커버 미쓰홍", 2026, 1, 2026, 2, "넷플릭스", "https://namu.wiki/w/%EC%96%B8%EB%8D%94%EC%BB%A4%EB%B2%84%20%EB%AF%B8%EC%93%B0%ED%99%8D"],

const LANG={영어:'--en',한국어:'--ko',독일어:'--de',프랑스어:'--fr',일본어:'--ja',스페인어:'--es',러시아어:'--ru',중국어:'--zh',스웨덴어:'--sv',기타:'--etc'};
const FORMAT={전자책:'--ebook',종이책:'--paperbook'};
const OWN={구매:'--buy',대여:'--rent'};
const THEATER={특:'--special',일반:'--normal',OTT:'--ott'};
const RATING={1:'--r1',2:'--r2',3:'--r3',4:'--r4',5:'--r5'};
const V=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const lum=x=>{let s=String(x).trim().replace('#','');if(s.length===3)s=s.split('').map(c=>c+c).join('');
 const f=i=>{const v=parseInt(s.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
 return .2126*f(0)+.7152*f(2)+.0722*f(4);};
const markColor=c=>lum(c)>.45?'#1F2226':'#FFFFFF';
const theaterLabel=k=>k==='특'?'특별관':k==='일반'?'일반관':k;
const minsToPages=m=>m?Math.max(40,Math.round(2.5*(+m)-100)):100;
const seasonKeyOf=d=>{const[y,m]=d.split('.').map(Number); if(m>=3&&m<=5)return y*10+1; if(m>=6&&m<=8)return y*10+2; if(m>=9&&m<=11)return y*10+3; if(m===12)return (y+1)*10+0; return y*10+0;};
const seasonLabelOf=k=>{const y=Math.floor(k/10),s=k%10; if(s===1)return y+' 봄'; if(s===2)return y+' 여름'; if(s===3)return y+' 가을'; return (y-1)+'-'+y+' 겨울';};
const B=BOOKS.map((r,i)=>({i,type:'book',date:r[1],title:r[2],author:r[3],pages:r[4],lang:r[5],pub:r[6],format:r[7],own:r[8],rating:r[9],seasonKey:seasonKeyOf(r[1])}));
const M=MOVIES.filter(r=>r[4]!=='The Royal Tenenbaums').map((r,i)=>({i:B.length+i,type:'movie',date:r[1],title:r[2],director:r[3],original:r[4],runtime:r[5],lang:r[6],theater:r[7],theaterType:r[8]||'일반',rating:r[9],viewCount:r[10]||1,pages:minsToPages(r[5]),seasonKey:seasonKeyOf(r[1])}));
const ALL=[...B,...M].sort((a,b)=>a.date.localeCompare(b.date));
const shelfYear=b=>Math.floor(b.seasonKey/10);
const PMIN=Math.min(...ALL.map(b=>b.pages)),PMAX=Math.max(...ALL.map(b=>b.pages));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

(function(){
 const fmt=d=>{const[y,m,dd]=d.split('.').map(Number);return y+'년 '+m+'월 '+dd+'일';};

// 서가 줄 묶기: 2025는 '겨울·봄' / '여름·가을' 두 줄, 그 외는 계절 그대로
function shelfGroups(year,items){
 const keys=[...new Set(items.map(b=>b.seasonKey))].sort((a,b)=>b-a);
 if(year!==2025)return keys.map(k=>({label:seasonLabelOf(k),keys:[k]}));
 const win=year*10+0,spr=year*10+1,sum=year*10+2,aut=year*10+3;
 return [{label:year+' 여름—가을',keys:[sum,aut]},{label:(year-1)+'-'+year+' 겨울—봄',keys:[win,spr]}]
  .filter(g=>g.keys.some(k=>keys.includes(k)));
}

function makeShelf(hostId,year){
 const host=document.getElementById(hostId);
 const items=ALL.filter(b=>shelfYear(b)===year);
 if(!items.length)return;
 const Bx=items.filter(b=>b.type==='book'),Mx=items.filter(b=>b.type==='movie');
 let MODE='lang',FILTER=null,cur=null;
 const modes=document.createElement('div'); modes.className='modes'; modes.setAttribute('role','group'); modes.setAttribute('aria-label',year+' 색상 기준');
 modes.innerHTML=[['lang','원어'],['format','전자책·종이책'],['own','구매·대여'],['theater','영화관·OTT'],['rating','별점']]
  .map(([k,l],i)=>'<button class="mode" type="button" data-mode="'+k+'" aria-pressed="'+(i===0)+'">'+l+'</button>').join('');
 const guide=document.createElement('p'); guide.className='mguide';
 guide.textContent='색을 누르면 그 분류만 골라 볼 수 있습니다.';
 const skey=document.createElement('div'); skey.className='shelf-key';
 skey.innerHTML='<span class="lg"><span class="sk"></span>책 — 높이는 쪽수</span>'
  +'<span class="lg"><span class="sk mv"></span>영화 — 높이는 러닝타임</span>';
 const legend=document.createElement('div'); legend.className='legend';
 const fhint=document.createElement('p'); fhint.className='fhint';
 const box=document.createElement('div');
 const tail=document.createElement('p'); tail.className='hint';
 tail.textContent='책등을 누르면 그 줄 아래에 작품 정보가 열립니다.';
 host.append(modes,guide,legend,fhint,box,tail);

 const keyOf=b=>{
  if(MODE==='lang')return b.lang||'미입력';
  if(MODE==='theater')return b.type==='movie'?(b.theaterType||'일반'):'해당 없음';
  if(MODE==='rating')return String(b.rating||'미입력');
  if(b.type==='movie')return '해당 없음';
  return MODE==='format'?b.format:b.own;};
 const baseColor=b=>{
  if(MODE==='lang')return b.lang&&LANG[b.lang]?V(LANG[b.lang]):'#BFBBB2';
  if(MODE==='theater')return b.type==='movie'?V(THEATER[b.theaterType||'일반']):'#BFBBB2';
  if(MODE==='rating')return b.rating&&RATING[b.rating]?V(RATING[b.rating]):'#BFBBB2';
  if(b.type==='movie')return '#BFBBB2';
  return MODE==='format'?V(FORMAT[b.format]):V(OWN[b.own]);};
 const color=b=>(FILTER&&keyOf(b)!==FILTER)?'#E6E4DF':baseColor(b);

 const groups=shelfGroups(year,items);
 const COLS=26;
 groups.forEach((g,gi)=>{
  const slug=hostId+'-g'+gi, list=items.filter(b=>g.keys.includes(b.seasonKey)).sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length)return;
  const bs=list.filter(b=>b.type==='book'), ms=list.filter(b=>b.type==='movie');
  const pg=bs.reduce((s,b)=>s+b.pages,0);
  const span=list[0].date.slice(0,7).replace('.','.')+' — '+list[list.length-1].date.slice(0,7);
  const row=document.createElement('div'); row.className='shelf-row';
  row.innerHTML='<div class="shelf-meta"><span class="shelf-year">'+g.label+'</span><span class="shelf-count">'
   +bs.length+'권 · '+pg.toLocaleString()+'쪽 · 영화 '+new Set(ms.map(m=>m.title)).size+'편 · '+span+'</span></div>';
  const sp=document.createElement('div'); sp.className='spines'; sp.style.gridTemplateColumns='repeat('+COLS+',1fr)';
  const nRows=Math.ceil(list.length/COLS), per=Math.ceil(list.length/nRows);
  const chunks=[]; for(let ci=0;ci<list.length;ci+=per)chunks.push(list.slice(ci,ci+per));
  const sps=chunks.map((ck,cj)=>{
   const d=document.createElement('div'); d.className='spines'; d.style.gridTemplateColumns='repeat('+COLS+',1fr)';
   if(cj)d.style.marginTop='6px';
   ck.forEach(b=>d.appendChild(mkSpine(b)));
   return d;});
  function mkSpine(b){const el=document.createElement('button');
   el.className=b.type==='book'?'spine':'spine tile'; el.type='button'; el.dataset.i=b.i; el.dataset.row=slug;
   el.style.height=(30+(b.pages-PMIN)/((PMAX-PMIN)||1)*58).toFixed(1)+'px';
   el.setAttribute('aria-pressed','false');
   el.setAttribute('aria-label',b.title+(b.type==='book'?' — '+b.author+', '+b.pages+'쪽':' (영화)'));
   el.addEventListener('click',()=>sel(b,el));
   el.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){ev.preventDefault();step(el,ev.key==='ArrowRight'?1:-1);}});
   return el;}
  sps.forEach(d=>row.appendChild(d));
  const ro=document.createElement('div'); ro.className='readout'; ro.id='ro-'+slug; ro.setAttribute('aria-live','polite');
  row.appendChild(ro); box.appendChild(row);
 });

 function paint(){
  box.querySelectorAll('.spine').forEach(el=>{const it=items.find(x=>x.i==+el.dataset.i),c=color(it);
   el.style.background=c; if(it&&it.type==='movie')el.style.setProperty('--mk',markColor(c));});
  let it=[];
  if(MODE==='lang'){const ls=[...new Set(items.map(b=>b.lang||'미입력'))].sort((a,b)=>items.filter(x=>(x.lang||'미입력')===b).length-items.filter(x=>(x.lang||'미입력')===a).length);
   it=ls.map(k=>[k+' '+items.filter(b=>(b.lang||'미입력')===k).length,(LANG[k]?V(LANG[k]):'#BFBBB2'),k]);}
  else if(MODE==='format')it=[...Object.keys(FORMAT).filter(k=>Bx.some(b=>b.format===k)).map(k=>[k+' '+Bx.filter(b=>b.format===k).length,V(FORMAT[k]),k]),['해당 없음(영화) '+Mx.length,'#BFBBB2','해당 없음']];
  else if(MODE==='own')it=[...Object.keys(OWN).filter(k=>Bx.some(b=>b.own===k)).map(k=>[k+' '+Bx.filter(b=>b.own===k).length,V(OWN[k]),k]),['해당 없음(영화) '+Mx.length,'#BFBBB2','해당 없음']];
  else if(MODE==='theater')it=[...Object.keys(THEATER).filter(k=>Mx.some(b=>(b.theaterType||'일반')===k)).map(k=>[theaterLabel(k)+' '+Mx.filter(b=>(b.theaterType||'일반')===k).length,V(THEATER[k]),k]),['해당 없음(책) '+Bx.length,'#BFBBB2','해당 없음']];
  else{const rs=[...new Set(items.map(b=>String(b.rating||'미입력')))].sort();
   it=rs.map(k=>[(k==='미입력'?'미입력':'\u2605'.repeat(+k))+' '+items.filter(b=>String(b.rating||'미입력')===k).length,(RATING[k]?V(RATING[k]):'#BFBBB2'),k]);}
  legend.className='legend'+(FILTER?' filtered':'');
  legend.innerHTML=it.map(([t,c,k])=>'<button class="lg" type="button" data-k="'+esc(k)+'" aria-pressed="'+(FILTER===k)+'"><span class="sw" style="background:'+c+'"></span>'+t+'</button>').join('');
  legend.querySelectorAll('button.lg').forEach(btn=>btn.addEventListener('click',()=>{FILTER=(FILTER===btn.dataset.k)?null:btn.dataset.k;paint();}));
  fhint.textContent=FILTER?'\u2018'+FILTER+'\u2019만 표시 중 — 다시 누르면 전체로 돌아갑니다.':'';
 }
 function applyFilter(mode,key){MODE=mode;FILTER=key;
  modes.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mode===mode)));paint();}
 function sel(b,el){const same=cur===el;

function makeStats(hostId,year,sumId){
 const items=ALL.filter(b=>shelfYear(b)===year);
 if(!items.length)return;
 const bs=items.filter(x=>x.type==='book'), ms=items.filter(x=>x.type==='movie');
 const pages=bs.reduce((s,b)=>s+b.pages,0);
 const uniq=new Set(ms.map(m=>m.title)).size;
 const five=items.filter(x=>String(x.rating)==='5').length;
 const special=ms.filter(m=>m.theaterType==='특').length;
 const thick=bs.slice().sort((a,b)=>b.pages-a.pages)[0];
 const cnt={}; ms.forEach(m=>cnt[m.title]=(cnt[m.title]||0)+1);
 const most=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
 const cells=[[bs.length,'읽은 책'],[pages.toLocaleString(),'쌓인 쪽수'],[uniq,'본 영화'],[special,'특별관 관람']];
 const notes=[];
 if(thick)notes.push('가장 두꺼웠던 책 <b>「'+thick.title+'」</b> '+thick.pages+'쪽');
 if(most&&most[1]>1)notes.push('가장 여러 번 본 영화 <b>「'+most[0]+'」</b> '+most[1]+'회');
 if(five)notes.push('별점 다섯 개 <b>'+five+'</b>편');
 document.getElementById(hostId).innerHTML=
  '<div class="facts">'+cells.map(([n,l])=>'<div class="fact"><span class="num">'+n+'</span><span class="lbl">'+l+'</span></div>').join('')+'</div>'
  +'<p class="stat-note">'+notes.join(' · ')+'</p>';
 const sl=document.getElementById('stLede'+year);
 if(sl)sl.textContent='그 해에 쌓인 것들. 쪽수는 책만 세었습니다.';
 const shl=document.getElementById('shelfLede'+year);
 if(shl)shl.textContent='책등 하나 = 책 한 권, 영화 한 편. 높이는 쪽수와 러닝타임, 색은 아래에서 고른 분류입니다. 한 칸 26권.';
 const tl=document.getElementById('thLede'+year);
 if(tl)tl.textContent='한 번으로 끝나지 않은 작품과 작가. 같은 문장을 두 번 읽고, 같은 장면 앞에 여러 번 앉았습니다.';
 const sum=document.getElementById(sumId);
 if(sum)sum.textContent='책 '+bs.length+'권 · 영화 '+uniq+'편 · 드라마 '+DRAMAS.filter(d=>d[1]===year||d[3]===year).length+'편';
}

// 만난 날들 — 월별 막대 (책 / 영화 / 드라마)
function makeDays(hostId,year){
 const host=document.getElementById(hostId);
 const items=ALL.filter(x=>+x.date.slice(0,4)===year);
 const dr=DRAMAS.filter(d=>d[1]===year||d[3]===year);
 if(!items.length&&!dr.length)return;
 const bk=Array(12).fill(0),mv=Array(12).fill(0),dm=Array(12).fill(0);
 items.forEach(x=>{const m=+x.date.slice(5,7)-1; if(x.type==='book')bk[m]++; else mv[m]++;});
 dr.forEach(d=>{const s=(d[1]===year?d[2]:1),e=(d[3]===year?d[4]:12); for(let m=s;m<=e;m++)dm[m-1]++;});
 const tot=bk.map((n,i)=>n+mv[i]+dm[i]);
 const max=Math.max(1,...tot), U=96/max;
 const lastM=Math.max(1,...items.map(x=>+x.date.slice(5,7)),...dr.map(d=>d[3]===year?d[4]:12));
 const empty=tot.slice(0,lastM).filter(n=>n===0).length;
 const top=tot.indexOf(max), sum=tot.reduce((a,b)=>a+b,0);
 const bar=(n,c)=>'<span class="mb '+c+'" style="height:'+(n*U).toFixed(1)+'px'+(n?'':';visibility:hidden')+'"></span>';
 const ld=document.getElementById('daysLede'+year);
 if(ld)ld.innerHTML='한 해 동안 <b>'+sum+'</b>번 무언가를 만났습니다. 가장 빽빽했던 달은 <b>'+(top+1)+'월</b>, '+max+'번. 아무것도 없던 달은 '+empty+'개.';
 host.innerHTML='<div class="days">'
  +'<div class="mbars">'+bk.map((n,i)=>'<span class="mcol">'+bar(n,'bk')+bar(mv[i],'mv')+bar(dm[i],'dr')+'</span>').join('')+'</div>'
  +'<div class="maxis">'+tot.map((n,i)=>'<span class="mlab">'+(i+1)+'<b>'+(n||'')+'</b></span>').join('')+'</div>'
  +'<p class="days-key">'
  +'<span class="lg"><span class="kb" style="background:#4A4740"></span>책</span>'
  +'<span class="lg"><span class="kb" style="box-shadow:inset 0 0 0 1.5px #4A4740"></span>영화</span>'
  +'<span class="lg"><span class="kb" style="background:#BFBBB2"></span>그 달에 보던 드라마</span>'
  +'<span class="lg">숫자는 그 달의 합계</span></p></div>';
}

const PLATFORM_MARK={
 "넷플릭스":{ch:'N',c:'#E50914'},"티빙":{ch:'T',c:'#FF153C'},"웨이브":{ch:'W',c:'#1351F9'},

function makeDrama(hostId,year){
 const wrap=document.getElementById(hostId);
 const list=DRAMAS.filter(d=>d[1]===year||d[3]===year);
 if(!list.length){wrap.innerHTML='<p class="blank">기록 없음</p>';return;}
 let DF=null;
 const rowsData=list.map(d=>{const s=(d[1]===year?d[2]:1),e=(d[3]===year?d[4]:12);
  return {title:d[0],p:d[5],wiki:d[6],s,e};})
  .sort((a,b)=>a.s-b.s||a.e-b.e||a.title.localeCompare(b.title,'ko'));
 const pcount={}; list.forEach(d=>pcount[d[5]]=(pcount[d[5]]||0)+1);
 const plats=Object.keys(pcount).sort((a,b)=>pcount[b]-pcount[a]);
 const top=plats[0], mcount=Array(12).fill(0);
 rowsData.forEach(o=>{for(let m=o.s;m<=o.e;m++)mcount[m-1]++;});
 const peak=mcount.indexOf(Math.max(...mcount));
 const dl=document.getElementById('drLede'+year);
 if(dl)dl.innerHTML=year+'년에 본 <b>'+list.length+'편</b>. '+top+'가 '+pcount[top]+'편으로 가장 많고, 가장 겹쳤던 달은 '+(peak+1)+'월입니다.';

 const legend=document.createElement('div'); legend.className='legend';

 axis.innerHTML='<span class="d-axis-l">제목을 누르면 나무위키</span><span class="d-ticks">'
  +Array.from({length:12},(_,i)=>'<span>'+(i%2===0?i+1:'')+'</span>').join('')+'</span>';
 const rows=document.createElement('div');
 rowsData.forEach(o=>{
  const mk=PLATFORM_MARK[o.p]||{ch:'?',c:'#6C6A63'};

  const a=document.createElement('a');
  a.className='d-row'; a.href=o.wiki; a.target='_blank'; a.rel='noopener';

   +'<span class="d-title">'+o.title+'</span><span class="d-per">'+per+'</span></span>'
   +'<span class="d-track"><span class="d-bar" style="grid-column:'+o.s+'/'+(o.e+1)+'"></span></span>';
  rows.appendChild(a);});
 const hint=document.createElement('p'); hint.className='hint';
 hint.textContent='막대 길이는 본 기간입니다. 플랫폼을 누르면 그 플랫폼만 볼 수 있습니다.';
 wrap.append(legend,axis,rows,hint);
 function draw(){
  legend.className='legend'+(DF?' filtered':'');
  legend.innerHTML=plats.map(p=>{const m=PLATFORM_MARK[p]||{ch:'?',c:'#6C6A63'};
   return '<button class="lg" type="button" data-k="'+esc(p)+'" aria-pressed="'+(DF===p)+'">'
    +'<span class="sw" style="background:'+m.c+';width:15px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;line-height:1">'+m.ch+'</span>'
    +p+' '+pcount[p]+'</button>';}).join('');
  legend.querySelectorAll('button.lg').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();
   DF=(DF===b.dataset.k)?null:b.dataset.k; draw(); filt();}));}
 function filt(){rows.querySelectorAll('a.d-row').forEach(el=>{
  el.hidden=!!(DF&&DF!==el.dataset.platform);});}
 draw(); filt();
}

const THREADS_DEF=[
 {name:'프로젝트 헤일메리',test:it=>/헤일메리|Hail Mary/i.test(it.title)},
 {name:'샐린저',test:it=>/샐린저/.test(it.title)||/샐린저/.test(it.author||'')||/Salinger|Rebel in the Rye|Royal Tenenbaums/i.test(it.original||'')},

 {name:'위키드',test:it=>/위키드/.test(it.title)}
];
const THREAD_TOP=5;
// year를 주면 그 해에 만난 것만 대상으로 (만난 날들 그래프와 같은 기준)
function makeThreads(hostId,keyId,year){
 const wrap=document.getElementById(hostId);
 if(!wrap)return;
 const pool=ALL.filter(x=>+x.date.slice(0,4)===year);
 const books=pool.filter(x=>x.type==='book'), movies=pool.filter(x=>x.type==='movie');
 const beadColor=it=>it.type==='book'?(FORMAT[it.format]?V(FORMAT[it.format]):'#BFBBB2')
                                     :(THEATER[it.theaterType]?V(THEATER[it.theaterType]):'#BFBBB2');
 const used=new Set(),rows=[];
 THREADS_DEF.forEach(d=>{const items=pool.filter(it=>d.test(it));
  if(items.length<2)return; items.forEach(it=>used.add(it.i)); rows.push({name:d.name,items});});
 const byA={}; books.forEach(b=>{if(used.has(b.i))return;(byA[b.author]=byA[b.author]||[]).push(b);});
 Object.entries(byA).filter(([,v])=>v.length>1).forEach(([a,v])=>{v.forEach(it=>used.add(it.i));rows.push({name:a,items:v});});
 const byT={}; movies.forEach(m=>{if(used.has(m.i))return;(byT[m.title]=byT[m.title]||[]).push(m);});
 Object.entries(byT).filter(([,v])=>v.length>1).forEach(([t,v])=>rows.push({name:t,items:v}));
 rows.sort((a,b)=>b.items.length-a.items.length||a.name.localeCompare(b.name,'ko'));
 const cut=rows.length>THREAD_TOP?rows[THREAD_TOP-1].items.length:0;
 const shown=rows.filter((r,i)=>i<THREAD_TOP||r.items.length===cut);
 const q=s=>'\u300c'+s+'\u300d';
 function describe(r){
  const bs=r.items.filter(x=>x.type==='book'), ms=r.items.filter(x=>x.type==='movie'), parts=[];
  if(bs.length){const ts=[...new Set(bs.map(b=>b.title))];
   parts.push('책 '+(ts.length<=3?ts.map(q).join(' · '):ts.slice(0,2).map(q).join(' · ')+' 외 '+(ts.length-2)+'권'));}
  if(ms.length){const c={}; ms.forEach(m=>c[m.title]=(c[m.title]||0)+1);
   const sp=ms.filter(m=>m.theaterType==='특').length, ott=ms.filter(m=>m.theaterType==='OTT').length;
   const seg=Object.entries(c).map(([t,n])=>q(t)+(n>1?' <b>'+n+'회차</b>':''));
   let tail=''; if(sp&&!ott)tail=' — 전부 특별관'; else if(ott&&!sp)tail=' — 전부 OTT'; else if(sp&&ott)tail=' — 특별관 '+sp+'회 · OTT '+ott+'편';
   parts.push('영화 '+(seg.length<=4?seg.join(' · '):seg.slice(0,3).join(' · ')+' 외 '+(seg.length-3)+'편')+tail);}
  return parts.join('<br>');}
 if(!shown.length){wrap.innerHTML='<p class="blank">그해엔 겹쳐진 이름이 없었다.</p>';
  document.getElementById(keyId).innerHTML='';return;}
 wrap.innerHTML=shown.map((r,idx)=>{
  const op=Math.max(.62,1-idx*.06).toFixed(2), bs=Math.max(9,14-idx);
  const beads=r.items.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(it=>
   '<span class="bead'+(it.type==='movie'?' mv':'')+'" style="background:'+beadColor(it)+'" title="'+esc(it.date+' \u00b7 '+it.title)+'"></span>').join('');
  return '<div class="thread" style="opacity:'+op+';--bs:'+bs+'px"><div class="th-name">'+r.name+'</div>'
   +'<div class="th-line">'+beads+'</div><div class="th-count">'+r.items.length+'<em>번</em></div>'
   +'<div class="th-desc">'+describe(r)+'</div></div>';}).join('');
 const chip=(cls,c)=>'<span class="bead '+cls+'" style="--bs:11px;background:'+c+';display:inline-block;vertical-align:-1px"></span>';
 document.getElementById(keyId).innerHTML=
  '<span class="lg">'+chip('',V('--paperbook'))+'종이책</span>'
  +'<span class="lg">'+chip('',V('--ebook'))+'전자책</span>'
  +'<span class="lg">'+chip('mv',V('--special'))+'특별관</span>'
  +'<span class="lg">'+chip('mv',V('--normal'))+'일반관</span>'
  +'<span class="lg">'+chip('mv',V('--ott'))+'OTT</span>'
  +'<span class="lg">만난 순서대로</span>';
}
