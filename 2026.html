// {name, sub, test} — test는 ALL의 항목 하나를 받아 이 묶음에 속하는지 판단
const THREADS_DEF=[
 {name:'프로젝트 헤일메리',sub:'원서·번역본 그리고 스크린',test:it=>/헤일메리|Hail Mary/i.test(it.title)},

 {name:'오디세이아',sub:'책에서 스크린으로',test:it=>/오디세이/.test(it.title)}
];
(function(){
 const wrap=document.getElementById('threads');
 const beadColor=it=>it.type==='book'
  ?(FORMAT[it.format]?V(FORMAT[it.format]):'#BFBBB2')
  :(THEATER[it.theaterType]?V(THEATER[it.theaterType]):'#BFBBB2');
 const used=new Set(),rows=[];
 // 1) 직접 정의한 묶음 (작품·이야기 단위, 매체를 건너뜀)
 THREADS_DEF.forEach(d=>{
  const items=ALL.filter(it=>d.test(it));
  if(items.length<2)return;
  items.forEach(it=>used.add(it.i));
  rows.push({name:d.name,sub:d.sub,items});
 });
 // 2) 같은 작가를 두 권 이상
 const byAuthor={};
 B.forEach(b=>{if(used.has(b.i))return;(byAuthor[b.author]=byAuthor[b.author]||[]).push(b);});
 Object.entries(byAuthor).filter(([,v])=>v.length>1).forEach(([a,v])=>{
  v.forEach(it=>used.add(it.i));
  rows.push({name:a,sub:'같은 작가를 '+v.length+'권',items:v});
 });
 // 3) 같은 영화를 다시 (N차 관람)
 const byTitle={};
 M.forEach(m=>{if(used.has(m.i))return;(byTitle[m.title]=byTitle[m.title]||[]).push(m);});
 Object.entries(byTitle).filter(([,v])=>v.length>1).forEach(([t,v])=>{
  rows.push({name:t,sub:v.length+'차 관람',items:v});
 });
 rows.sort((a,b)=>b.items.length-a.items.length||a.name.localeCompare(b.name,'ko'));
 if(!rows.length){wrap.innerHTML='<p class="blank">아직 겹쳐진 이름이 없습니다.</p>';return;}
 wrap.innerHTML=rows.map((r,idx)=>{
  const op=Math.max(.58,1-idx*.07).toFixed(2), bs=Math.max(9,14-idx);
  const beads=r.items.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(it=>
   '<span class="bead'+(it.type==='movie'?' mv':'')+'" style="background:'+beadColor(it)+'" title="'+it.date+' · '+it.title+'"></span>').join('');
  return '<div class="thread" style="opacity:'+op+';--bs:'+bs+'px">'
   +'<div class="th-name">'+r.name+'<span class="th-sub">'+r.sub+'</span></div>'
   +'<div class="th-line">'+beads+'</div>'
   +'<div class="th-count">'+r.items.length+'<em>번</em></div></div>';
 }).join('');
 const chip=(cls,c)=>'<span class="bead '+cls+'" style="--bs:10px;background:'+c+';display:inline-block;vertical-align:-1px"></span>';
 document.getElementById('threadKey').innerHTML=
  chip('',V('--paperbook'))+chip('',V('--ebook'))+'<span>책(종이·전자)</span>'
  +chip('mv',V('--special'))+chip('mv',V('--normal'))+'<span>영화(특별관·일반관)</span>'
  +'<span>· 왼쪽에서 오른쪽으로, 만난 순서대로</span>';
})();

 "티빙":{ch:'T',bg:'#FF6B00',fg:'#1F2226',bd:'#FF6B00',barFg:'rgba(31,34,38,.8)'},
 "웨이브":{ch:'W',bg:'#1F8FFF',fg:'#FFFFFF',bd:'#1F8FFF',barFg:'rgba(255,255,255,.95)'},
 "Disney+":{ch:'D',bg:'#0F3EBE',fg:'#FFFFFF',bd:'#0F3EBE',barFg:'rgba(255,255,255,.95)'},
 "Coupang Play":{ch:'C',bg:'#FF3D75',fg:'#FFFFFF',bd:'#FF3D75',barFg:'rgba(255,255,255,.95)'},
 "Apple TV":{ch:'A',bg:'#1D1D1F',fg:'#FFFFFF',bd:'#1D1D1F',barFg:'rgba(255,255,255,.95)'}};
let DFILTER=null;
(function(){
 const wrap=document.getElementById('dramaTimeline');
 const usedPlatforms=[...new Set(DRAMAS.map(d=>d[3]))];
 const legend=document.createElement('div'); legend.className='legend'; legend.id='dramaLegend';
 wrap.appendChild(legend);

 // 가로 타임라인 — 한 편 = 한 줄, 막대 길이 = 본 기간, 제목은 막대 옆에 붙임(모바일 1줄 유지)
 const SEASONS=[['겨울',1,2],['봄',3,5],['여름',6,8],['가을',9,11],['겨울',12,12]];
 const tl=document.createElement('div'); tl.className='tl';
 tl.innerHTML='<div class="tl-seasons">'
  +SEASONS.map(([n,a,b])=>'<span style="grid-column:'+a+'/'+(b+1)+'">'+n+'</span>').join('')
  +'</div><div class="tl-months">'
  +Array.from({length:12},(_,i)=>'<span>'+(i+1)+'</span>').join('')+'</div>';
 const rows=document.createElement('div'); rows.className='tl-rows';

 DRAMAS.slice().sort((a,b)=>a[1]-b[1]||a[2]-b[2]||a[0].localeCompare(b[0],'ko'))
  .forEach(([title,start,end,platform,wiki])=>{
   const period=start===end?start+'월':start+'~'+end+'월';
   const mk=PLATFORM_MARK[platform]||{ch:'?',barFg:'#fff'};
   // 오른쪽에 4칸 이상 남으면 제목을 오른쪽에, 아니면 왼쪽에 (왼쪽 자리도 없으면 오른쪽)
   const right=(12-end)>=4||start<2;
   const label=right
    ? '<span class="tl-label rt" style="grid-column:'+(end+1)+'/13">'+title+'</span>'
    : '<span class="tl-label lf" style="grid-column:1/'+start+'">'+title+'</span>';
   const row=document.createElement('a');
   row.className='tl-row'; row.href=wiki; row.target='_blank'; row.rel='noopener';
   row.dataset.platform=platform;
   row.title=title+' · '+platform+' · '+period+' — 나무위키에서 보기';
   row.innerHTML='<span class="tl-bar" style="grid-column:'+start+'/'+(end+1)
    +';background:'+V(PLATFORM[platform])+';color:'+mk.barFg+'">'+mk.ch+'</span>'+label;
   rows.appendChild(row);
  });
 tl.appendChild(rows); wrap.appendChild(tl);

 const hint=document.createElement('p'); hint.className='hint';
 hint.textContent='막대 길이 = 본 기간. 한 줄을 누르면 나무위키로 이동합니다.';
 wrap.appendChild(hint);

 function badge(p){
  const m=PLATFORM_MARK[p];
  if(!m)return '<span class="sw" style="background:'+V(PLATFORM[p])+'"></span>';
  return '<span class="pb" style="background:'+m.bg+';color:'+m.fg+';box-shadow:inset 0 0 0 1px '+m.bd+'">'+m.ch+'</span>';
 }
 function drawLegend(){
  legend.className='legend'+(DFILTER?' filtered':'');
  legend.innerHTML=usedPlatforms.map(p=>{
   const cnt=DRAMAS.filter(d=>d[3]===p).length;
   return '<button class="lg" type="button" data-k="'+p+'" aria-pressed="'+(DFILTER===p)+'">'+badge(p)+p+' '+cnt+'</button>';
  }).join('');
  legend.querySelectorAll('button.lg').forEach(btn=>btn.addEventListener('click',e=>{
   e.preventDefault();
   DFILTER=(DFILTER===btn.dataset.k)?null:btn.dataset.k; drawLegend(); paintDim();
  }));
 }
 function paintDim(){
  rows.querySelectorAll('a.tl-row').forEach(el=>{
   el.style.opacity=(DFILTER&&DFILTER!==el.dataset.platform)?'.22':'1';
  });
 }
 drawLegend(); paintDim();
})();

// 웹툰·웹소설·만화책: 클릭하면 바로 이어보기 (플랫폼은 링크로 대신하니 별도 표기 없음)
const WEBSTUFF={
 webtoon:[
  {title:'데뷔 못 하면 죽는 병 걸림',url:'https://page.kakao.com/content/59782511/'},
  {title:'괴담에 떨어져도 출근을 해야 하는구나',url:'https://page.kakao.com/content/69229506/'}
 ],
 webnovel:[
  {title:'괴담에 떨어져도 출근을 해야 하는구나',url:'https://page.kakao.com/content/69229506/'}
 ],
 comic:[]
};
(function(){
 const grid=document.getElementById('webMemo');
 const cols=[['웹툰','webtoon','--es'],['웹소설','webnovel','--de'],['만화책','comic','--ko']];
 grid.innerHTML=cols.map(([label,key,cv])=>{
  const items=WEBSTUFF[key],c=V(cv);
  const body=items.length
   ?'<ul>'+items.map(it=>'<li><a href="'+it.url+'" target="_blank" rel="noopener">'+it.title+'</a></li>').join('')+'</ul>'
   :'<p class="memo-empty">아직 없음</p>';
  return '<div class="memo-col" style="--wt:'+c+'"><h3><span class="dot" style="background:'+c+'"></span>'+label+'<span class="cnt">'+items.length+'</span></h3>'+body+'</div>';
 }).join('');
})();
</script></body></html>
