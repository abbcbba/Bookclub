<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>금요일 독서모임 기록</title>
<meta name="description" content="2021–2027 · 격주 금요일, 함께 읽은 책들">
<meta property="og:type" content="website">
<meta property="og:url" content="https://abbcbba.github.io/Bookclub/">
<meta property="og:title" content="금요일 독서모임 기록">
<meta property="og:description" content="2021–2027 · 격주 금요일, 함께 읽은 책들">
<meta property="og:image" content="https://abbcbba.github.io/Bookclub/og-image.png?v=20261126c">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FBF8F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="독서모임">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--paper:#FBF8F1;--card:#FFFFFF;--ink:#1F2226;--soft:#6C6A63;--faint:#A9A49A;--rule:#ECE6DA;--on:#A03A34;
/* 원어 색: 어족별 — 게르만 파랑 · 동아시아 초록 · 로망스 주황 · 슬라브 보라 · 기타 회색. 같은 계열은 많이 읽은 쪽이 진함 */
--en:#3F6E9E;--de:#86A6C8;--ko:#2F6B57;--ja:#8DB596;--fr:#C8693E;--es:#E2A65B;--ru:#8C6BAA;--etc:#ABA59C;
--bar:#D3CCC0;--track:#EDEAE4;--lit:#8FA99C;
--serif:"Gowun Batang",serif;--sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-bottom:calc(84px + var(--safe))}
.top{padding:18px 20px 2px}
.h{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.01em}
.sub{color:var(--soft);font-size:13px;margin-top:3px}
.search{display:flex;align-items:center;gap:8px;margin:14px 20px 0;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:0 12px}
.search input{flex:1;padding:11px 0;font-size:16px;outline:none;min-width:0}
.search input::placeholder{color:var(--faint)}
.search .x{width:28px;height:28px;border-radius:50%;color:var(--soft);font-size:18px;line-height:1;display:none}
.search.has .x{display:block}
.chips{position:relative;display:flex;flex-wrap:nowrap;gap:5px;padding:10px 16px 12px}
.chip.dd{display:flex;align-items:center;gap:3px;margin-left:auto}.chip.dd .car{font-size:10px;opacity:.7}
.menu{position:absolute;right:16px;top:calc(100% - 6px);z-index:15;width:210px;background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px;border-radius:8px;font-size:14px;text-align:left}
.menu button em{font-style:normal;color:var(--soft);font-size:12px}
.menu button[aria-checked="true"]{background:var(--paper);font-weight:500}
.menu .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:5px 10px;font-size:13px;color:var(--soft);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.stick{position:sticky;top:0;z-index:5;background:var(--paper);padding-top:10px;border-bottom:1px solid var(--rule)}
.stick .search{margin-top:0}
.tabs{display:flex;gap:2px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;padding:7px 14px;border-radius:999px;font-size:14px;color:var(--soft)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;font-weight:500}
.ysum{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 4px}
.ysum .y{font-family:var(--serif);font-weight:700;font-size:20px}.ysum .s{font-size:12px;color:var(--soft)}
.ysum.one{padding:10px 20px 2px}
.ysum .save{font-size:12px;color:var(--ink);text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:4px 10px;background:var(--card)}
.ysum.one{align-items:center}
.imgs{padding-bottom:12px}.imgs p{font-size:14px;font-weight:500}.imgs p span{display:block;font-size:12px;color:var(--soft);font-weight:400;margin-top:2px}
.imgs div{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.more .imgs a.yi{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--ink)}
.more .imgs+a{border-top:1px solid var(--rule);padding-top:11px}
.ysub{padding:12px 20px 2px;font-size:12px;font-weight:600;color:var(--soft);letter-spacing:.04em}
.row{display:flex;align-items:flex-end;gap:14px;width:100%;text-align:left;padding:12px 20px;border-bottom:1px solid var(--rule)}
.row:active{background:rgba(0,0,0,.03)}
.row .dt{width:38px;flex:none;align-self:center;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.row .mid{flex:1;min-width:0;align-self:center}
.row .ti{font-weight:500;font-size:15.5px;line-height:1.35}
.row .au{font-size:13px;color:var(--soft);margin-top:2px}
.row .nbt{color:var(--on)}
.spn{flex:none;width:14px;border-radius:2px 2px 0 0;position:relative}
.spn:after{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:#fff;opacity:.4}
.empty{padding:48px 20px;text-align:center;color:var(--soft);font-size:14px}
/* stats */
.now{margin-top:10px}.now .lb{font-size:12px;color:var(--on);font-weight:600;letter-spacing:.03em}
.now .nv{display:flex;align-items:baseline;gap:10px;margin-top:4px}.now .nv b{font-family:var(--serif);font-size:30px}.now .nv span{color:var(--soft);font-size:14px}
.ms{display:flex;align-items:flex-end;gap:3px;height:36px;margin-top:12px;border-bottom:2px solid var(--ink)}.ms i{flex:1;max-width:14px;border-radius:2px 2px 0 0}
.now .lt{font-size:13px;margin-top:10px}.now .lt span{color:var(--soft);margin-left:4px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 14px}
.mini div{background:var(--card);border-radius:12px;padding:10px 12px;font-size:11.5px;color:var(--soft)}
.mini b{display:block;font-size:18px;font-weight:600;color:var(--ink);margin-top:2px}
.cd{background:var(--card);border-radius:14px;margin:8px 14px;padding:16px}
.cd h3{font-size:14px;font-weight:500;margin-bottom:12px}.cd h3 span{color:var(--soft);font-weight:400;font-size:12px;margin-left:6px}
.yb{display:flex;align-items:flex-end;gap:8px;height:110px}
.yb div{flex:1;text-align:center;font-size:11px;color:var(--soft)}
.yb i{display:block;background:var(--bar);border-radius:4px 4px 0 0;margin-bottom:4px}
.yb .cur i{background:var(--on)}.yb em{display:block;font-style:normal;color:var(--ink);font-size:12px;margin-bottom:3px}
.rib{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:1px;background:var(--card)}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12px;color:var(--soft)}
.key i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.gl{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 10px;align-items:center;font-size:12px}
.gl .yr{color:var(--soft)}.gl .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--rule)}
.gl .bar i{background:var(--lit)}.gl .n{color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.hb{display:grid;grid-template-columns:88px 1fr 26px;gap:6px 10px;align-items:center;font-size:12.5px}
.hb .t{height:8px;border-radius:4px;background:var(--track);overflow:hidden}.hb .t i{display:block;height:100%;background:var(--bar)}
.hb .n{text-align:right;color:var(--soft)}
.au2{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-top:1px solid var(--rule)}
.au2:first-child{border:0;padding-top:0}.au2 span{color:var(--soft);font-size:12px;text-align:right}
/* tab bar */
.bar-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--rule);padding-bottom:var(--safe)}
.bar-nav .in{max-width:560px;margin:0 auto;display:flex}
.bar-nav button{flex:1;height:62px;font-size:12px;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.bar-nav button[aria-selected="true"]{color:var(--ink);font-weight:500}
/* sheet */
.shade{position:fixed;inset:0;z-index:30;background:rgba(20,20,20,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 22px calc(24px + var(--safe));transform:translateY(105%);transition:transform .25s ease;max-height:88vh;overflow-y:auto}
.open .shade{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#D5D1C9;margin:0 auto 16px}
.sheet .d{font-size:13px;color:var(--soft)}
.sheet h2{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.25;margin:6px 0 4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.kv div{background:var(--paper);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--soft)}
.kv b{display:block;font-size:15px;color:var(--ink);font-weight:500;margin-top:2px}
.kv .hl b{color:var(--on)}
.same{margin-top:14px;font-size:13px;color:var(--soft)}.same button{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.links a{display:block;text-align:center;padding:13px 8px;border-radius:12px;font-size:14px;font-weight:500;text-decoration:none}
.links .k{background:var(--ink);color:#fff}.links .a{border:1px solid var(--rule);color:var(--ink)}
.links a:only-child{grid-column:1/-1}
.links .lib{grid-column:1/-1}
.guide{display:block;margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--paper);color:var(--ink);font-weight:600;font-size:15px;text-decoration:none}
.guide+.links{margin-top:8px}
.kdc{margin-top:12px;font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}.kdc span{margin-left:4px;color:var(--faint)}
.sheet .cp{font:inherit;color:inherit;text-align:left;padding:0;cursor:copy;-webkit-tap-highlight-color:transparent}
.sheet .cp:active{opacity:.6}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));z-index:60;transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;transition:opacity .2s,transform .2s;max-width:calc(100vw - 40px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
.kdc .isbn{font-size:12.5px;color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px;font-variant-numeric:tabular-nums;padding:6px 0}
.more a{display:block;padding:11px 0;border-top:1px solid var(--rule);color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
.more a:first-of-type{border:0;padding-top:0}
.more a span{display:block;font-size:12px;color:var(--soft);font-weight:400;margin-top:2px}
.sheet .cls{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;font-size:20px;color:var(--soft)}
[hidden]{display:none!important}
/* 목록 이미지 보기: 이미지를 길게 눌러 사진에 저장 */
.imgview{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 16px calc(16px + var(--safe))}
.imgview img{max-width:100%;max-height:calc(100vh - 120px);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);-webkit-touch-callout:default;user-select:auto}
.imgview p{color:#fff;font-size:13px;margin-top:12px;opacity:.9;text-align:center}
.imgview .lbx{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:22px}
/* 노트북·태블릿 가로: 목록과 통계를 나란히, 상세는 가운데 창 */
@media (min-width:900px){
.wrap{max-width:1160px;display:grid;grid-template-columns:minmax(0,1fr) 400px;column-gap:32px;padding:0 28px 48px}
.top{grid-column:1/-1;padding:36px 0 14px}.h{font-size:34px}.sub{font-size:14px}
#view-list{grid-column:1;min-width:0}
#view-stats{grid-column:2;display:block!important;position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:10px 0 24px;scrollbar-width:thin}
#view-stats .mini,#view-stats .cd{margin-left:0;margin-right:0}#view-stats .now{margin-top:0}
.stick .search{margin-left:0;margin-right:0}.tabs{padding-left:0;padding-right:0}.chips{padding-left:0;padding-right:0}.menu{right:0}
.ysum,.ysum.one{padding-left:4px;padding-right:4px}.ysub{padding-left:4px}.row{padding-left:4px;padding-right:4px;border-radius:6px}
.row:hover{background:rgba(0,0,0,.03)}
.bar-nav{display:none}
.sheet{left:50%;right:auto;bottom:auto;top:50%;width:480px;max-width:calc(100vw - 48px);border-radius:20px;padding:22px 26px 24px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s}
.open .sheet{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.grab{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="wrap">

<header class="top">
<h1 class="h" id="h">금요일 독서모임 기록</h1>
<p class="sub" id="sub"></p>
</header>

<main id="view-list">
<div class="stick">
<div class="search" id="sbox"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#A9A49A" stroke-width="2" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg>
<input id="q" type="search" placeholder="제목·저자 검색" autocomplete="off" aria-label="제목이나 저자로 검색"><button class="x" id="qx" type="button" aria-label="검색어 지우기">×</button></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="연도"></nav>
</div>
<div class="chips" id="chips" role="group" aria-label="필터"></div>
<div id="list"></div>
</main>

<main id="view-stats" hidden></main>

</div>

<nav class="bar-nav" role="tablist" aria-label="보기"><div class="in">
<button type="button" role="tab" data-v="list" aria-selected="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h12"/></svg>기록</button>
<button type="button" role="tab" data-v="stats" aria-selected="false"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="3" y="10" width="3" height="7" rx="1"/><rect x="8.5" y="5" width="3" height="12" rx="1"/><rect x="14" y="8" width="3" height="9" rx="1"/></svg>통계</button>
</div></nav>

<div id="sheetwrap"><div class="shade" id="shade"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="st" tabindex="-1"></section></div>

<script src="books.js"></script>
<script>
(function(){
const LANG={영어:'--en',한국어:'--ko',독일어:'--de',프랑스어:'--fr',일본어:'--ja',스페인어:'--es',러시아어:'--ru'};
const V=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const col=l=>V(LANG[l]||'--etc');
const grp=l=>LANG[l]?l:'기타';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G=(typeof GUIDES!=='undefined')?GUIDES:{};
const KDC=['총류','철학','종교','사회과학','자연과학','기술과학','예술','언어','문학','역사'];
const B=D.map((r,i)=>({i,year:r[0],date:r[1],title:r[2],author:r[3],pages:r[4],lang:r[5],pub:r[6],genre:r[7],nobel:r[8],fem:r[9],ny:r[10],sub:r[11],kdc:r[12],press:r[13]||'',isbn:r[14]||''}))
  .sort((a,b)=>a.year-b.year||a.date.localeCompare(b.date));
const YEARS=[...new Set(B.map(b=>b.year))].sort((a,b)=>b-a);
const CUR=YEARS[0];
/* 첫해(2021, 1권)는 다음 해와 한 칸으로 묶는다: 연도 탭·목록·통계 공통 */
const MERGE={2021:2022};
const gk=y=>MERGE[y]||y;
const GKEYS=[...new Set(YEARS.map(gk))];
const gyears=k=>YEARS.filter(y=>gk(y)===k).sort((a,b)=>a-b);
const imgLink=(k,c,t)=>{const r=B.filter(b=>gk(b.year)===k),f=glab(k).replace('–','-');return '<a class="'+c+'" href="lists/'+f+'.png?v='+r.length+'-'+r[r.length-1].date+'" data-img="1" data-label="'+glab(k)+'">'+t+'</a>';};
const glab=k=>{const ys=gyears(k);return ys.length>1?ys[0]+'–'+String(ys[ys.length-1]).slice(2):String(k);};
const md=d=>{const[m,x]=d.split('.');return (+m)+'.'+(+x)};
const fmt=n=>n.toLocaleString('ko-KR');
const PMAX=Math.max(...B.map(b=>b.pages));
const norm=s=>s.toLowerCase().replace(/[\s:·,.『』]/g,'');

const $=id=>document.getElementById(id);
const END=Math.max(2027,CUR); // 미리보기 이미지·제목의 '2021–2027'과 맞춤
$('sub').textContent=B[0].year+'–'+END+' · '+B.length+'권 · '+fmt(B.reduce((s,b)=>s+b.pages,0))+'쪽 · '+new Set(B.map(b=>b.lang)).size+'개 언어';

/* ---------- 목록 ---------- */
const FILTERS=[
 {k:'lit',t:'문학',f:b=>b.genre==='문학'},
 {k:'non',t:'논픽션',f:b=>b.genre==='논픽션'},
 {k:'nobel',t:'노벨상',f:b=>b.nobel},
 {k:'fem',t:'여성 작가',f:b=>b.fem===1}];
const LANGS=Object.keys(LANG).concat('기타');
let st={year:CUR,q:'',f:null,lang:null},menuOpen=false;
function chips(){
 $('chips').innerHTML=FILTERS.map(x=>'<button class="chip" type="button" data-f="'+x.k+'" aria-pressed="'+(st.f===x.k)+'">'+x.t+'</button>').join('')
  +'<button class="chip dd" type="button" id="langbtn" aria-haspopup="true" aria-expanded="'+menuOpen+'" aria-pressed="'+!!st.lang+'">'
  +(st.lang?'<span class="dot" style="background:'+V(LANG[st.lang]||'--etc')+'"></span>'+st.lang:'원어')+'<span class="car" aria-hidden="true">▾</span></button>'
  +(menuOpen?'<div class="menu" role="menu" aria-label="원어">'
   +[['',null,B.length]].concat(LANGS.map(l=>[l,l,B.filter(b=>grp(b.lang)===l).length])).map(([t,l,n])=>
     '<button type="button" role="menuitemradio" data-l="'+(l||'')+'" aria-checked="'+(st.lang===l)+'"><span>'+(l?'<span class="dot" style="background:'+V(LANG[l]||'--etc')+'"></span>'+l:'전체 원어')+'</span><em>'+n+'</em></button>').join('')
   +'</div>':'');
}
function tabs(){
 const all=!!(st.q||st.f||st.lang);
 $('tabs').innerHTML=(all?'<button class="tab" type="button" role="tab" aria-selected="true">전체 연도</button>':'')
  +GKEYS.map(k=>'<button class="tab" type="button" role="tab" data-y="'+k+'" aria-selected="'+(!all&&st.year===k)+'">'+glab(k)+'</button>').join('');
}
function row(b){
 return '<button class="row" type="button" data-i="'+b.i+'"><span class="dt">'+b.date+'</span><span class="mid"><span class="ti">'+esc(b.title)+'</span><span class="au" style="display:block">'+esc(b.author)+' · '+esc(b.lang)+(b.nobel?' · <span class="nbt">노벨상</span>':'')+'</span></span><span class="spn" aria-hidden="true" style="height:'+(14+b.pages/PMAX*34).toFixed(1)+'px;background:'+col(b.lang)+'"></span></button>';
}
function list(){
 const q=norm(st.q),F=FILTERS.find(x=>x.k===st.f);
 const all=!!(q||F||st.lang);
 const hit=B.filter(b=>(all||gk(b.year)===st.year)&&(!q||norm(b.title+b.author).includes(q))&&(!F||F.f(b))&&(!st.lang||grp(b.lang)===st.lang));
 if(!hit.length){$('list').innerHTML='<p class="empty">맞는 책이 없습니다.</p>';return;}
 $('list').innerHTML=GKEYS.filter(k=>hit.some(b=>gk(b.year)===k)).map(y=>{
  const r=hit.filter(b=>gk(b.year)===y).reverse(),yr=B.filter(b=>gk(b.year)===y);
  const s=all?r.length+'권':yr.length+'권 · '+fmt(yr.reduce((a,b)=>a+b.pages,0))+'쪽'+(y===CUR?' · 진행 중':'');
  return (all?'<div class="ysum"><span class="y">'+glab(y)+'</span><span class="s">'+s+'</span></div>':'<div class="ysum one"><span class="s">'+s+'</span>'+imgLink(y,'save','이미지로 저장')+'</div>')+(gyears(y).length>1?gyears(y).slice().reverse().filter(x=>r.some(b=>b.year===x)).map(x=>'<p class="ysub">'+x+'</p>'+r.filter(b=>b.year===x).map(row).join('')).join(''):r.map(row).join(''));
 }).join('');
}
function render(){chips();tabs();list();}
$('chips').addEventListener('click',e=>{
 e.stopPropagation();
 const m=e.target.closest('.menu button');
 if(m){st.lang=m.dataset.l||null;menuOpen=false;render();$('langbtn').focus();return;}
 const c=e.target.closest('.chip');if(!c)return;
 if(c.id==='langbtn'){menuOpen=!menuOpen;chips();if(menuOpen){const on=document.querySelector('.menu [aria-checked="true"]');(on||document.querySelector('.menu button')).focus();}return;}
 st.f=st.f===c.dataset.f?null:c.dataset.f;menuOpen=false;render();});
document.addEventListener('click',e=>{if(menuOpen&&!e.target.closest('#chips')){menuOpen=false;chips();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen){menuOpen=false;chips();$('langbtn').focus();}});
$('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;
 if(t.dataset.y){st.year=+t.dataset.y;}else{st.q='';st.f=null;st.lang=null;$('q').value='';$('sbox').classList.remove('has');}
 render();const top0=$('view-list').offsetTop;if(scrollY>top0)window.scrollTo({top:top0});});
$('q').addEventListener('input',e=>{st.q=e.target.value;$('sbox').classList.toggle('has',!!st.q);tabs();list();});
$('qx').addEventListener('click',()=>{$('q').value='';st.q='';$('sbox').classList.remove('has');tabs();list();$('q').focus();});
$('list').addEventListener('click',e=>{const r=e.target.closest('.row');if(r)openSheet(B.find(b=>b.i===+r.dataset.i),r);});

/* ---------- 상세 시트 ---------- */
let lastFocus=null;
function openSheet(b,from){
 lastFocus=from||document.activeElement;
 const same=B.filter(x=>x.author===b.author&&x!==b);
 const kq=encodeURIComponent(b.title+' '+b.author);
 $('sheet').innerHTML='<div class="grab"></div><button class="cls" type="button" aria-label="닫기">×</button>'
  +'<p class="d">'+b.year+'. '+md(b.date)+' 모임</p><h2 id="st"><button type="button" class="cp" data-cp="'+esc(b.title)+'" aria-label="제목 복사">'+esc(b.title)+'</button></h2>'
  +'<p class="d"><button type="button" class="cp" data-cp="'+esc(b.author)+'" aria-label="저자 복사">'+esc(b.author)+'</button>'+(b.press?' · '+esc(b.press):'')+'</p>'
  +'<div class="kv"><div>원작<b>'+b.pub+'년 · '+esc(b.lang)+'</b></div><div>분량<b>'+b.pages+'쪽</b></div>'
  +'<div>장르<b>'+esc(b.sub)+'</b></div>'
  +(b.nobel?'<div class="hl">노벨문학상<b>'+b.ny+'년 수상</b></div>':'<div>분류<b>'+esc(b.genre)+'</b></div>')+'</div>'
  +((b.kdc!=null||b.isbn)?'<p class="kdc">'+(b.kdc!=null?'KDC '+b.kdc+' <span>'+KDC[Math.floor(b.kdc/100)]+'</span>':'')+(b.kdc!=null&&b.isbn?' · ':'')+(b.isbn?'ISBN <button type="button" class="isbn" data-isbn="'+b.isbn+'" aria-label="ISBN 복사">'+b.isbn+'</button>':'')+'</p>':'')
  +(same.length?'<p class="same">같은 작가 · '+same.map(x=>'<button type="button" data-i="'+x.i+'">'+esc(x.title)+'</button> ('+x.year+'. '+md(x.date)+')').join(', ')+'</p>':'')
  +(G[b.title]?'<a class="guide" href="'+G[b.title][0]+'">'+esc(G[b.title][1])+' 보기 →</a>':'')+'<div class="links"><a class="k" href="https://search.kyobobook.co.kr/search?keyword='+kq+'" target="_blank" rel="noopener">교보문고에서 보기</a>'
  +(b.isbn?'<a class="a" href="https://www.aladin.co.kr/shop/wproduct.aspx?ISBN='+b.isbn+'" target="_blank" rel="noopener">알라딘 책 정보</a>':'')
  +'<a class="a lib" href="https://www.snlib.go.kr/intro/plusSearchResultList.do?searchType=SIMPLE&amp;searchCategory=BOOK&amp;searchKey=TITLE&amp;searchKeyword='+encodeURIComponent(b.title.replace(/[:·,]/g,' ').replace(/\s+/g,' ').trim())+'" target="_blank" rel="noopener">성남시 도서관에서 찾기</a></div>';
 document.body.classList.add('open');
 $('sheet').focus({preventScroll:true});
}
function closeSheet(){document.body.classList.remove('open');if(lastFocus)lastFocus.focus({preventScroll:true});}
$('shade').addEventListener('click',closeSheet);
$('sheet').addEventListener('click',e=>{
 if(e.target.closest('.cls'))return closeSheet();
 const cp=e.target.closest('.cp');
 if(cp){copyText(cp.dataset.cp,()=>toast('복사됨 · '+cp.dataset.cp));return;}
 const ib=e.target.closest('.isbn');
 if(ib){const t=ib.dataset.isbn,done=()=>{ib.textContent='복사됨 ✓';setTimeout(()=>{ib.textContent=t;},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>{});
  else{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');done();}catch(_){}x.remove();}
  return;}
 const s=e.target.closest('.same button');if(s)openSheet(B.find(b=>b.i===+s.dataset.i),lastFocus);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('open'))closeSheet();});
/* 복사: 글자는 그대로 두고 아래에 잠깐 알림 */
function copyText(t,done){
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>{});
 else{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');done();}catch(_){}x.remove();}
}
function toast(m){
 let el=document.getElementById('toast');
 if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el);}
 el.textContent=m;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1400);
}
/* 아래로 끌어 닫기 */
(function(){let y0=null;const sh=$('sheet');
 sh.addEventListener('touchstart',e=>{y0=sh.scrollTop<=0?e.touches[0].clientY:null;},{passive:true});
 sh.addEventListener('touchmove',e=>{if(y0===null)return;const dy=e.touches[0].clientY-y0;if(dy>0)sh.style.transform='translateY('+dy+'px)';},{passive:true});
 sh.addEventListener('touchend',e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;sh.style.transform='';y0=null;if(dy>90)closeSheet();});})();

/* ---------- 통계 ---------- */
function stats(){
 const tot=B.length,pg=B.reduce((s,b)=>s+b.pages,0),pf=B.filter(b=>b.fem!==2);
 const G2=GKEYS.slice().reverse().map(gyears);
 const inG=g=>B.filter(b=>g.includes(b.year));
 const gl=(g,short)=>g.length>1?(short?String(g[0]).slice(2)+'–'+String(g[g.length-1]).slice(2):g[0]+'–'+String(g[g.length-1]).slice(2)):(short?String(g[0]).slice(2):String(g[0]));
 const mx=Math.max(...G2.map(g=>inG(g).length));
 const L={};B.forEach(b=>{const k=grp(b.lang);L[k]=(L[k]||0)+1;});const le=Object.entries(L).sort((a,b)=>b[1]-a[1]);
 const S={};B.forEach(b=>S[b.sub]=(S[b.sub]||0)+1);const se=Object.entries(S).sort((a,b)=>b[1]-a[1]),smx=se[0][1];
 const work=t=>t.replace(/\s*\d+$/,'');const A={};B.forEach(b=>(A[b.author]=A[b.author]||[]).push(b));
 const rep=Object.keys(A).filter(a=>new Set(A[a].map(x=>work(x.title))).size>1).sort((a,b)=>a.localeCompare(b,'ko'));
 const etc=B.filter(b=>!LANG[b.lang]),ec={};etc.forEach(b=>ec[b.lang]=(ec[b.lang]||0)+1);
 const cy=B.filter(b=>b.year===CUR),last=cy[cy.length-1],cmx=Math.max(...cy.map(b=>b.pages));
 $('view-stats').innerHTML=
  '<section class="cd now"><p class="lb">'+CUR+' · 진행 중</p><p class="nv"><b>'+cy.length+'권</b><span>'+fmt(cy.reduce((a,b)=>a+b.pages,0))+'쪽</span></p>'
  +'<div class="ms" aria-hidden="true">'+cy.map(b=>'<i style="height:'+(10+b.pages/cmx*26).toFixed(1)+'px;background:'+col(b.lang)+'"></i>').join('')+'</div>'
  +'<p class="lt">최근 · '+esc(last.title)+' <span>'+md(last.date)+'</span></p></section>'
  +'<section class="cd"><h3>원어<span>원작이 쓰인 언어</span></h3><div class="rib">'+le.map(([k,n])=>'<i style="width:'+(n/tot*100)+'%;background:'+V(LANG[k]||'--etc')+'"></i>').join('')+'</div>'
  +'<div class="key">'+le.map(([k,n])=>'<span><i style="background:'+V(LANG[k]||'--etc')+'"></i>'+k+' '+n+'</span>').join('')+'</div>'
  +(etc.length?'<p class="key" style="margin-top:6px">기타: '+Object.entries(ec).sort((a,b)=>b[1]-a[1]).map(([k,n])=>k+' '+n).join(' · ')+'</p>':'')+'</section>'
  +'<div class="mini"><div>여성 작가<b>'+Math.round(pf.filter(b=>b.fem===1).length/pf.length*100)+'%</b></div><div>노벨상 작가<b>'+B.filter(b=>b.nobel).length+'권</b></div><div>권당 평균<b>'+Math.round(pg/tot)+'쪽</b></div></div>'
  +'<section class="cd"><h3>연도별 권수</h3><div class="yb">'+G2.map(g=>{const n=inG(g).length;return '<div class="'+(g.includes(CUR)?'cur':'')+'"><em>'+n+'</em><i style="height:'+(n/mx*70)+'px"></i>'+gl(g,true)+'</div>';}).join('')+'</div></section>'
  +'<section class="cd"><h3>문학 · 논픽션<span>연도별 문학 권수</span></h3><div class="gl">'+G2.slice().reverse().map(g=>{const r=inG(g),l=r.filter(b=>b.genre==='문학').length;return '<span class="yr">'+gl(g)+'</span><span class="bar"><i style="width:'+(l/r.length*100)+'%"></i></span><span class="n">'+l+'/'+r.length+'</span><span class="n">'+Math.round(l/r.length*100)+'%</span>';}).join('')+'</div></section>'
  +'<section class="cd"><h3>세부 장르</h3><div class="hb">'+se.map(([k,n])=>'<span>'+k+'</span><span class="t"><i style="width:'+(n/smx*100)+'%"></i></span><span class="n">'+n+'</span>').join('')+'</div></section>'
  +'<section class="cd"><h3>두 번 이상 읽은 작가<span>'+rep.length+'명</span></h3>'+rep.map(a=>'<div class="au2">'+esc(a)+'<span>'+[...new Set(A[a].map(x=>work(x.title)))].map(esc).join(', ')+'</span></div>').join('')+'</section>'
  +'<section class="cd more"><h3>함께 보기</h3><div class="imgs"><p>연도별 목록 이미지<span>폰에 저장하기 좋은 세로 이미지</span></p><div>'+GKEYS.map(k=>imgLink(k,'yi',glab(k))).join('')+'</div></div><a href="Dante.html">신곡 길잡이<span>지옥 · 연옥 · 천국편과 신곡 속 성경</span></a><a href="star.html">출간 후 기간과 누적 대출건수<span>98권 · 2026년 9월 기준</span></a><a href="archive.html">예전 기록 페이지<span>서가·차트·해설 (2026년 11월까지 메인)</span></a></section>';
}

/* ---------- 탭 전환 ---------- */
document.querySelectorAll('.bar-nav button').forEach(btn=>btn.addEventListener('click',()=>{
 const v=btn.dataset.v;
 document.querySelectorAll('.bar-nav button').forEach(x=>x.setAttribute('aria-selected',String(x===btn)));
 $('view-list').hidden=v!=='list';$('view-stats').hidden=v!=='stats';
 if(v==='stats'&&!$('view-stats').innerHTML)stats();
 window.scrollTo(0,0);
}));

/* 연도별 목록 이미지: 화면 위에 띄워서 길게 눌러 저장 (아이폰·카톡 브라우저 공통) */
document.addEventListener('click',e=>{
 const a=e.target.closest('a[data-img]');
 if(!a)return;
 e.preventDefault();
 const lb=document.createElement('div');lb.className='imgview';lb.setAttribute('role','dialog');lb.setAttribute('aria-label',a.dataset.label+' 목록 이미지');
 lb.innerHTML='<button type="button" class="lbx" aria-label="닫기">×</button><img src="'+a.getAttribute('href')+'" alt="'+a.dataset.label+' 읽은 책 목록"><p>'+(matchMedia('(hover:hover)').matches?'이미지를 오른쪽 클릭해서 저장하세요':'이미지를 길게 눌러 사진에 저장하세요')+'</p>';
 const close=()=>{lb.remove();document.removeEventListener('keydown',esc);a.focus();};
 const esc=ev=>{if(ev.key==='Escape')close();};
 lb.addEventListener('click',ev=>{if(ev.target.tagName!=='IMG')close();});
 document.addEventListener('keydown',esc);
 document.body.appendChild(lb);lb.querySelector('.lbx').focus();
});

/* 넓은 화면에서는 통계를 처음부터 옆에 그려 둔다 */
const WIDE=matchMedia('(min-width:900px)');
const wide=()=>{if(WIDE.matches&&!$('view-stats').innerHTML)stats();};
wide();WIDE.addEventListener('change',wide);
render();
})();
</script>
</body></html>
